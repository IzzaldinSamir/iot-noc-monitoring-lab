version: '3.8'

services:
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: noc-iot-broker
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped

  mosquitto-exporter:
    image: sapcc/mosquitto-exporter:latest
    container_name: noc-mosquitto-exporter
    ports:
      - "9234:9234"
    environment:
      - MQTT_ENDPOINT=tcp://mosquitto:1883
    depends_on:
      - mosquitto
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: noc-cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: noc-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: noc-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=secure_noc_admin
    depends_on:
      - prometheus
    restart: unless-stopped

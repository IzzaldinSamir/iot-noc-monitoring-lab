version: '3.8'

services:
  # 1. IoT Message Broker (MQTT) - Handles all the fake device traffic
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: noc-iot-broker
    ports:
      - "1883:1883" # Standard MQTT port
      - "9001:9001" # WebSockets port
    restart: unless-stopped

  # 2. NOC Time-Series Database - Scrapes and stores the network metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: noc-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    restart: unless-stopped

  # 3. NOC Visual Dashboard - The front-end UI for the NOC team
  grafana:
    image: grafana/grafana:latest
    container_name: noc-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=secure_noc_admin # Default password
    depends_on:
      - prometheus
    restart: unless-stopped
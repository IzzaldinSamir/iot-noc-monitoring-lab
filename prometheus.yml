global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'iot_broker_metrics'
    static_configs:
      - targets: ['mosquitto-exporter:9234']

  - job_name: 'docker_container_metrics'
    static_configs:
      - targets: ['cadvisor:8080']

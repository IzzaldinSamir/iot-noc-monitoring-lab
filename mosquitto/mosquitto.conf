# Local lab configuration. Host ports bind to 127.0.0.1 by default in Compose.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# Publish broker statistics under $SYS every 10 seconds for the exporter.
sys_interval 10

# Anonymous access is restricted to the host loopback interface by Compose.
allow_anonymous true

listener 1883 0.0.0.0
protocol mqtt

listener 9001 0.0.0.0
protocol websockets

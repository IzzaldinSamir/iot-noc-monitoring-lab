global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: iot-noc-lab

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: mosquitto
    static_configs:
      - targets:
          - mosquitto-exporter:9344

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093
